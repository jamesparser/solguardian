[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solguardian"
version = "0.1.0"
description = "Automated exploit hunting for Solidity (EVM/HyperEVM) and Rust (Solana/Anchor) sources - heuristic, offline, built with IBM Bob 2.0"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jason Parser Research" }]
keywords = ["smart-contract-security", "solidity", "solana", "anchor", "hyperevm", "static-analysis", "ibm-bob"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
solguardian = "solguardian.cli:main"

[project.urls]
Homepage = "https://github.com/jamesparser/solguardian"
Demo = "https://jamesparser.github.io/solguardian/"

[tool.setuptools]
packages = [
  "solguardian",
  "solguardian.core",
  "solguardian.detectors",
  "solguardian.report",
  "solguardian.agents",
]

[tool.setuptools.package-data]
"solguardian.report" = ["templates/*.sol", "templates/*.rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
